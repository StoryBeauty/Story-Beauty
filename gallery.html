<script>
    document.addEventListener("DOMContentLoaded", function () {
        const fullscreenVideos = document.querySelectorAll(".lightbox video");
    
        fullscreenVideos.forEach(video => {
            video.classList.add("fullscreen-video");
    
            video.addEventListener("loadedmetadata", function () {
                adjustVideoSize(video);
            });
    
            window.addEventListener("resize", function () {
                adjustVideoSize(video);
            });
        });
    
        function adjustVideoSize(video) {
            const screenWidth = window.innerWidth * 0.9;
            const screenHeight = window.innerHeight * 0.9;
            
            if (video.videoWidth > screenWidth || video.videoHeight > screenHeight) {
                video.style.maxWidth = `${screenWidth}px`;
                video.style.maxHeight = `${screenHeight}px`;
            } else {
                video.style.maxWidth = `${video.videoWidth}px`;
                video.style.maxHeight = `${video.videoHeight}px`;
            }
        }
    });
    </script>
    
<script>
    document.addEventListener("DOMContentLoaded", function () {
        const fullscreenImages = document.querySelectorAll(".lightbox img");
    
        fullscreenImages.forEach(img => {
            img.classList.add("fullscreen-image");
            
            img.addEventListener("load", function () {
                adjustImageSize(img);
            });
    
            window.addEventListener("resize", function () {
                adjustImageSize(img);
            });
        });
    
        function adjustImageSize(img) {
            const screenWidth = window.innerWidth * 0.9;
            const screenHeight = window.innerHeight * 0.9;
            
            if (img.naturalWidth > screenWidth || img.naturalHeight > screenHeight) {
                img.style.maxWidth = `${screenWidth}px`;
                img.style.maxHeight = `${screenHeight}px`;
            } else {
                img.style.maxWidth = `${img.naturalWidth}px`;
                img.style.maxHeight = `${img.naturalHeight}px`;
            }
        }
    });
    </script>
